[alembic]
script_location = alembic

# The real DATABASE_URL is loaded by alembic/env.py via
# app.core.config.get_database_url(), which overrides sqlalchemy.url below.
# The value here is a placeholder only; do not put real credentials in this file.
sqlalchemy.url = postgresql+psycopg://user:password@localhost:5432/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
