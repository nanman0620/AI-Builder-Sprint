[project]
name = "eum-server"
version = "0.1.0"
description = "이음(E-um) MVP FastAPI server"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "tzdata; sys_platform == 'win32'",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
